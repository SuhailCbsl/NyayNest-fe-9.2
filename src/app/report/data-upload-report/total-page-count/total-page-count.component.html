<!-- BACKDROP -->
@if (show) {
  <div class="cnr-backdrop" (click)="close()"></div>
}
<!-- MODAL CENTERED -->
@if (show) {
  <div class="cnr-modal">
    <div
      class="cnr-modal-box cnr-popup-animate"
      (click)="$event.stopPropagation()"
    >
      <div class="cnr-modal-header">
        <h3>Total Page Count</h3>
        <button class="close-btn" (click)="close()">×</button>
      </div>

      <div class="cnr-modal-body">
        <div class="table-responsive">
          <table class="table table-bordered text-center align-middle mb-0">
            <thead>
              <tr>
                <th
                  class="header-cell fw-bold"
                  style="background: #caced2 !important"
                >
                  Collection Name
                </th>
                <th
                  class="header-cell fw-bold"
                  style="background: #caced2 !important"
                >
                  Total Page Count
                </th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let row of totalPageCountList">
                <td>{{ row.collection_name }}</td>
                <td>{{ row.page_count }}</td>
              </tr>

              <tr class="fw-bold total-row">
                <td>Total</td>
                <td>{{ totalPages }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
}
