@if (hasSubSections$ | async) {
  <div
    class="dso-button-menu mb-1"
    ngbDropdown
    container="body"
    placement="bottom-right"
  >
    <div
      class="d-flex flex-row flex-nowrap"
      [ngbTooltip]="itemModel.text | translate"
      container="body"
    >
      <button
        [attr.aria-label]="itemModel.text | translate"
        [title]="itemModel.text | translate"
        class="btn btn-dark btn-sm"
        ngbDropdownToggle
        [dsBtnDisabled]="section.model?.disabled"
        role="menuitem"
        tabindex="0"
      >
        <i class="fas fa-{{ section.icon }} fa-fw"></i>
      </button>

      <ul ngbDropdownMenu class="dso-edit-menu-dropdown p-1" role="menu">
        <li
          *ngFor="
            let subSection of subSections$ | async;
            trackBy: trackBySectionId
          "
          class="nav-item nav-link d-flex flex-row p-2"
          role="presentation"
        >
          <div *ngIf="renderIcons$ | async" class="me-2">
            <i
              *ngIf="subSection.icon; else spacer"
              class="fas fa-{{ subSection.icon }} fa-fw"
              aria-hidden="true"
            >
            </i>

            <ng-template #spacer>
              <i class="fas fa-fw" aria-hidden="true"></i>
            </ng-template>
          </div>

          <ng-container *ngIf="sectionMap$ | async as sectionMap">
            <ng-container *ngIf="sectionMap.get(subSection.id) as menuSection">
              <ng-container
                *ngComponentOutlet="
                  menuSection.component;
                  injector: menuSection.injector
                "
              >
              </ng-container>
            </ng-container>
          </ng-container>
        </li>
      </ul>
    </div>
  </div>
}
